artifacts = ["/app"]
name = "registry-resolver-reconciler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''
This is the job a registry-platform engineer gets after a migration goes wrong, and the second half
cannot start until the first half is right. The migration truncated the authoritative registry
index, so the index has to be rebuilt from a pre-migration snapshot and a replay journal before
anything is resolved. The board's final recovery decision governs how: a replayed release overwrites
the record already holding that version in place, a retracted one is removed outright, the journal's
own bookkeeping fields never reach the index, and the order of the result is fixed. Get that merge
wrong and every artifact downstream is wrong with it. The snapshot still marks a build withdrawn
that was later republished, and it still carries a release the journal retracted. Either one left
uncorrected moves the version the selection stage picks.

Two earlier recovery entries have to be traced past. A February draft says to concatenate the two
sources and let the precedence sort settle the overlaps. A March interim appends replayed releases
at the end and narrows what a retraction removes. Neither is the rule that governs, and both read as
though they might be.

Only then can the resolution dialect itself be reconstructed, and it lives in a long decision log
rather than a specification. Version precedence, constraint satisfaction, the direction selection
takes, pin overrides, the yanked and pre-release admission gates, the per-channel ledger with its
re-selection cap, the topological install order, cycle handling and the per-channel capacity cap
each have to be traced to their final dated decision, and each was fixed on its own date. Many of
them deliberately depart from what semver and pip do, so handing the graph to packaging or pip
returns confident wrong answers. Holding the recovery semantics and the whole interacting rule set
in view at once is what separates a correct reconstruction from a plausible one.

Scale is the other constraint. The graded registry holds tens of thousands of releases across a
deep, heavily shared dependency graph, and the reach report asks each entry how many distinct
packages it reaches through dependency edges running to an earlier install. Build that set once per
package and reuse it and the whole thing is one pass. Recompute it per package and it is quadratic
in the resolved set, which will not come back inside the 120-second budget the contract publishes.
The install order has the same shape: a counter-based topological pass is linear, while rescanning
every remaining package each round is not.

Everything the task ships is synthetic. The snapshot, the journal, the request set and the
governance log were generated for this task and describe no real registry, package or maintainer.
The size is what keeps the problem honest: twenty-four thousand packages and a graph dozens of
layers deep is where a resolver's asymptotics start to bite, so the per-package recomputation that
reads most naturally has to give way to something engineered.
'''
solution_explanation = '''
solution/solve.sh runs the two dependent steps inside the environment container.

Step one is solution/recover_index.py, which implements the board's final recovery decision,
#REG-7170. It starts from /app/data/registry_snapshot_pre_migration.json in file order and replays
/app/data/registry_replay_journal.json in ascending journal_seq. A replayed release overwrites the
first record of that package already holding the same version string, keeping its position; a
release the package never held is appended to the end of its list. A retraction drops every record
it names. The journal's journal_seq, journal_op, package and reason fields are bookkeeping and do
not survive into a release record. The rebuilt index is written back over the truncated
/app/data/registry_index.json.

Step two copies solution/resolver_fixed.py over /app/workflow/resolver.py and runs it against that
recovered index. It canonicalises and deduplicates the requests under the governance tie-break
chain, parses versions under the governance precedence, which treats build metadata as significant,
and then resolves each channel and package to the lowest satisfying version. Packages the policy
names in selection_overrides take the highest instead. Pins override the selection, and the yanked
and pre-release gates decide what is admissible at all. That runs inside a per-channel monotone
ledger which keeps sub-dependencies consistent as constraints tighten and re-selects up to the
policy's cap, freezing a package beyond it. The install plan is ordered topologically with the
governed tie-break, cycles are reported rather than fatal, and the capacity cap is applied to the
ordered rows rather than before them. It writes exactly summary.json, resolution.json and a compact
install_plan.jsonl into --output-dir.

Every governing value is traced to its final entry in /app/incident/registry_governance_log.md.
report_spec.json supplies the output contract and no derivation rule.
'''
verification_explanation = '''
The verifier builds its own image from tests/Dockerfile, which the agent never sees. It collects the
agent's whole /app as the declared artifact and runs tests/test_outputs.py against it.

Step one is graded directly. The recovered /app/data/registry_index.json must equal the sealed
expected index, every release record must carry release fields and nothing else, and the two
recovery sources must come back byte-identical. The shipped truncated file, the snapshot on its own
and the superseded concatenation merge are each required to differ from the governed result. The
agent's own resolver is then re-run against the snapshot-alone and concatenation indexes, on the
packages the journal actually retracts, and required to disagree with what it produces from the
governed index. That is what makes the two steps provably dependent rather than merely sequential.

Step two runs the agent's /app/workflow/resolver.py as a subprocess under an unprivileged uid, using
setpriv with a scrubbed environment, over both the recovered index and a held-out alternate request
set. The three artifacts are diffed against sealed fixtures generated from the reference. Schema,
field, sort and status invariants are checked separately, along with the summary arithmetic,
idempotency, the CLI defaults, and that the registry-index and policy paths genuinely influence the
output. An AST scan reads every Python file under /app/workflow, not just the entry point, and
rejects an import of packaging, pip, setuptools or semantic_version, or any route to eval, exec or
compile including aliases and attribute access. Nothing in the suite passes or fails on how long a
run took: the budget the contract publishes is checked for consistency against the spec, and
correctness is graded on the reports, the reach counts and the install order.

The deviations from ordinary resolution are pinned by name. One test proves selection takes the
lower of two live versions rather than the higher, which is backwards from pip and semver. Another
proves a dependency cycle is non-fatal by requiring every package the summary calls cyclic to still
carry a resolved entry. Build metadata as precedence-significant, and the yanked and pre-release
exemptions, are pinned by the sealed digests instead of by tests of their own.

Every branch the policy and the log define is reached by the graded request set and named: the pin
that binds against a constraint and only on its own channel, a pin naming a version the index does
not carry, a yanked build that stays eligible because its package is exempt beside one that is
excluded because it is not, the selection override that takes the highest rather than the lowest,
that package's own alternative-report cap, a pre-release admitted only where the channel allows one
and only at or above the rank floor, and a per-package re-selection cap that freezes a package the
baseline cap would have resolved. The two source-path probes check the run the amended input implies
rather than merely that something changed. Amending the capacity cap to one must leave each
channel's first ordered row and nothing else. Yanking every release of a non-exempt package in the
closure must turn exactly that package into an unsatisfiable conflict and move the conflict weight
by one package's worth.

The frozen broken snapshot /app/workflow/.resolver.original is asserted present by hash and wrong by
output. All of this was confirmed locally in the real two-container flow: after solve.sh the
verifier gives reward 1, a fresh environment with no solve.sh gives 0, and so does an environment
where the resolver is repaired but the index is never recovered.
'''
relevant_experience = '''
Recovering a corrupted package index from a snapshot and a replay journal, under retraction and
replacement semantics, and rebuilding a stateful constraint-resolution pipeline from an
authoritative but noisy decision log rather than a clean specification. That means tracing
incrementally revised rules to their final form, matching a byte-level output contract, and knowing
when not to delegate to semver or pip because the governing dialect has moved away from them.
'''
