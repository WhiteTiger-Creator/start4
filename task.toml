artifacts = ["/app"]
name = "registry-resolver-reconciler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''
Restoring this reconciler is the work of a registry-platform or package-infrastructure engineer
responding to a botched migration, and it is a genuinely dependent chain rather than a single repair.
The migration truncated the authoritative registry index, so the first step is to rebuild
/app/data/registry_index.json by merging a pre-migration snapshot with a replay journal under the
board's final recovery decision -- in-place overwrite of a replayed release, full retraction of a
withdrawn one, journal bookkeeping fields stripped, and a specific resulting order. Every downstream
artifact is wrong if that merge is wrong: the snapshot still marks a build withdrawn that was later
republished, and still carries a release the journal retracted, and either one left uncorrected changes
which version the selection stage picks. Scale is the second constraint: the graded registry holds tens of thousands of releases across a deep,
heavily shared dependency graph, and the board's reach report asks each entry for the number of distinct
packages reachable through dependency edges that run to an earlier install. Building that set once per
package and reusing it costs a single pass; recomputing it per package is quadratic in the resolved set
and cannot finish inside the 120-second wall-clock budget the contract states. The ordering itself has the
same shape -- a counter-based topological pass is linear where rescanning every remaining package each
round is quadratic. Two superseded recovery entries (a February draft that says to
concatenate the two sources and let the precedence sort settle overlaps, a March interim that appends
replayed releases at the end and narrows retractions) are there to be traced past. Only then can the
engineer reconstruct the governance-defined resolution dialect itself from a long, mostly-noise decision
log rather than a specification: the version precedence, constraint satisfaction, the selection
direction, pin overrides, the yanked and pre-release admission gates, the per-channel selection ledger
with its re-selection cap, the topological install order, cycle handling and the per-channel capacity
cap all have to be traced to their final dated decision, each fixed independently. Many of those rules
deliberately deviate from vanilla semver / pip resolution, so loading the graph into packaging or pip
and delegating produces wrong answers and is rejected. Holding the recovery semantics and the whole
interacting rule set in mind at once is what separates a correct reconstruction from a plausible-looking
one.
'''
solution_explanation = '''
solution/solve.sh drives the two dependent steps inside the environment container. Step one runs
solution/recover_index.py, which implements the board's final recovery decision (#REG-7170): start from
/app/data/registry_snapshot_pre_migration.json in file order, replay
/app/data/registry_replay_journal.json in ascending journal_seq order, overwrite the first record of a
package already holding the replayed version string in place, append genuinely new releases at the end
of that package's list, drop every record named by a retraction, strip journal_seq / journal_op /
package / reason, and write the rebuilt index back over the truncated /app/data/registry_index.json.
Step two copies solution/resolver_fixed.py over /app/workflow/resolver.py and runs it against that
recovered index. The reconciler canonicalizes and deduplicates requests under the final governance
tie-break chain, parses versions under the governance precedence (build metadata significant), satisfies
constraints, then resolves each (channel, package) to the lowest satisfying version by default (the
highest for packages named in the policy's selection_overrides list), honoring pin overrides and the
governance yanked/pre-release gates, inside a per-channel monotone fixpoint ledger that keeps
sub-dependencies consistent and re-selects up to a policy cap. It builds a topologically ordered install
plan with a governance tie-break and non-fatal cycle handling, applies a per-channel capacity cap after
ordering, and reports conflicts. It writes exactly summary.json, resolution.json and compact
install_plan.jsonl into --output-dir. Every governing value is traced to its final entry in
/app/incident/registry_governance_log.md; report_spec.json supplies only the output contract and no
derivation rule.
'''
verification_explanation = '''
The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the
agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is
graded directly: the recovered /app/data/registry_index.json must equal the sealed expected index, every
release record must carry only release fields, the two recovery sources must be intact, and the shipped
truncated file, the snapshot alone and the superseded concatenation merge are each asserted different
from it -- then the agent's own resolver is re-run on all three wrong indexes and required to disagree
with the sealed outputs, which is what makes the two steps provably dependent. Step two executes the
agent's /app/workflow/resolver.py as a subprocess under an unprivileged uid (setpriv 65534, scrubbed
environment, hard timeout) over both the recovered index and a held-out alternate request set, and
diffs summary.json, resolution.json and install_plan.jsonl against sealed fixtures generated from the
reference. It also checks schema/field/sort/status invariants, summary math, idempotency, the CLI
defaults, and that the registry-index and policy paths actually influence output. A static AST scan
forbids importing packaging/pip/setuptools/semantic_version, and dedicated tests prove the governance
dialect deviates from standard semver: the reconciler picks the lowest satisfying version where pip
would pick the highest, treats +build metadata as precedence-significant, admits yanked and pre-release
builds only under governance exemptions, and keeps cycles non-fatal. It checks the reach report against the sealed fixture, and enforces the 120-second budget on the graded
run so a per-package recomputation cannot pass. The frozen broken snapshot
/app/workflow/.resolver.original is asserted present and wrong by hash. Confirmed locally in the real
two-container flow: after solve.sh the verifier gives reward 1; a fresh environment with no solve.sh
gives 0, and so does an environment where the resolver is repaired but the index is never recovered.
'''
relevant_experience = '''
Experience recovering a corrupted package index from a snapshot plus a replay journal under
retraction/replacement semantics, and reconstructing stateful constraint-resolution pipelines from an
authoritative but noisy decision log rather than a clean spec -- tracing incrementally-revised rules to
their final form, matching a byte-level output contract, and deliberately avoiding semver/pip delegation
where the governing dialect diverges from standard resolution semantics.
'''
category = "Software"
subcategory = "Languages"
tags = ["package-management", "version-constraints", "dependency-graph", "registry", "incident-recovery"]
expert_time_estimate_hours = 4
difficulty = "advanced"
languages = ["python"]

